<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- smartmotion mark, light mode: the same M on a pale tile. The small triangle
       between the walls is cut out, with the light at its far point. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFE"/>
      <stop offset="1" stop-color="#E7E7F2"/>
    </linearGradient>
    <!-- walls: fuchsia to lime, stepped through the hues between so it never greys -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="436" y2="0">
      <stop offset="0" stop-color="#C4007F"/>
      <stop offset="0.2" stop-color="#E0125F"/>
      <stop offset="0.4" stop-color="#EE4A2A"/>
      <stop offset="0.6" stop-color="#EE9306"/>
      <stop offset="0.8" stop-color="#B4BC00"/>
      <stop offset="1" stop-color="#55A300"/>
    </linearGradient>
    <!-- the faint light at the end, as in the dark icon -->
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="256" cy="276" r="84">
      <stop offset="0" stop-color="#FFFDF2" stop-opacity="1"/>
      <stop offset="0.06" stop-color="#FFF8E1" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#FFE9A8" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFD23F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <polygon points="203,396 309,396 256,276" fill="#000000"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="url(#bg)" stroke="#D5D5E3" stroke-width="2"/>
  <g clip-path="url(#tile)">
    <g mask="url(#cut)">
      <polygon points="76,384 190,128 304,384" fill="url(#g)"/>
      <polygon points="208,384 322,128 436,384" fill="url(#g)"/>
    </g>
    <circle cx="256" cy="276" r="84" fill="url(#light)"/>
  </g>
</svg>
