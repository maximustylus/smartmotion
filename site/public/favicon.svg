<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .tile-light { display: inline; } .tile-dark { display: none; }
    @media (prefers-color-scheme: dark) { .tile-light { display: none; } .tile-dark { display: inline; } }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="436" y2="0">
      <stop offset="0" stop-color="#FF1FB3"/><stop offset="0.36" stop-color="#FF6A5A"/><stop offset="0.68" stop-color="#FFD23F"/><stop offset="1" stop-color="#A6FF1F"/>
    </linearGradient>
    <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="436" y2="0">
      <stop offset="0" stop-color="#C4007F"/><stop offset="0.4" stop-color="#EE4A2A"/><stop offset="0.6" stop-color="#EE9306"/><stop offset="1" stop-color="#55A300"/>
    </linearGradient>
    <mask id="cut"><rect width="512" height="512" fill="#fff"/><polygon points="203,396 309,396 256,276" fill="#000"/></mask>
  </defs>
  <g class="tile-light">
    <rect width="512" height="512" rx="112" fill="#F3F3F8"/>
    <g mask="url(#cut)" fill="url(#gl)"><polygon points="76,384 190,128 304,384"/><polygon points="208,384 322,128 436,384"/></g>
  </g>
  <g class="tile-dark">
    <rect width="512" height="512" rx="112" fill="#000"/>
    <g mask="url(#cut)" fill="url(#g)"><polygon points="76,384 190,128 304,384"/><polygon points="208,384 322,128 436,384"/></g>
    <circle cx="256" cy="276" r="6" fill="#FFFDF2"/>
  </g>
</svg>
